{% extends 'main/base.html' %}
{% block title %}Login - Shop Module{% endblock %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-header bg-white py-3">
                <h4 class="card-title mb-0 fw-bold">Login</h4>
                <p class="text-muted small mb-0">Enter your Email ID or Username and password to access the web panel.</p>
            </div>
            <div class="card-body p-4">
                <form method="POST" novalidate>
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary">Login to Web Panel</button>
                    </div>
                </form>
                <div class="text-center mt-3 pt-3 border-top">
                    <p class="text-muted small mb-0">Don't have an account? <a href="{% url 'sign_up' %}" class="fw-semibold">Sign Up here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
